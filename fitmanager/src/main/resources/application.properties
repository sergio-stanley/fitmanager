spring.application.name=fitmanager
spring.profiles.default=dev

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# O schema é criado só pelo Flyway (db/migration). O Hibernate apenas confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Paginação (API_CONTRACT.md, seção 2.6): formato estável { content, page }, padrão 20, máximo 100.
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# CORS (API_CONTRACT.md, seção 1). Em produção, sobrescrever com APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=http://localhost:5173
