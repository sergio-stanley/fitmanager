services:
  db:
    image: postgres:16-alpine
    container_name: fitmanager-db
    environment:
      POSTGRES_DB: ${DB_NAME:-fitmanager}
      POSTGRES_USER: ${DB_USERNAME:?defina DB_USERNAME no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"   # só acessível pela própria máquina
    volumes:
      - fitmanager-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fitmanager-data:
